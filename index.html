<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Share Decks</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #0d0f12;
      --muted: #6f747c;
      --line: #dadde2;
      --accent: #073bb7;
      --paper: #f8f8f6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
      background: var(--paper);
      color: var(--ink);
    }

    main {
      width: min(1120px, calc(100vw - 48px));
      margin: 0 auto;
      padding: 64px 0;
    }

    .meta {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    h1 {
      margin: 24px 0 72px;
      font-size: clamp(48px, 9vw, 128px);
      line-height: .95;
      font-weight: 260;
      letter-spacing: 0;
    }

    .deck {
      display: grid;
      grid-template-columns: minmax(120px, 18vw) 1fr auto;
      gap: 32px;
      align-items: center;
      border-top: 1px solid var(--line);
      padding: 28px 0;
      text-decoration: none;
      color: inherit;
    }

    .deck:last-child { border-bottom: 1px solid var(--line); }

    .number {
      font-size: clamp(40px, 8vw, 88px);
      line-height: .9;
      font-weight: 220;
      color: var(--accent);
    }

    .title {
      font-size: clamp(24px, 3.2vw, 44px);
      line-height: 1.1;
      font-weight: 320;
    }

    .desc {
      margin-top: 10px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
    }

    .arrow {
      font-size: 40px;
      color: var(--accent);
    }

    @media (max-width: 720px) {
      main { width: min(100vw - 32px, 1120px); padding: 40px 0; }
      h1 { margin-bottom: 48px; }
      .deck { grid-template-columns: 1fr auto; gap: 16px; }
      .number { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <main>
    <div class="meta">Godwarlock · Share Decks</div>
    <h1>Web PPT<br />Archive</h1>

    <a class="deck" href="./codex-agent-share/ppt/">
      <div class="number">01</div>
      <div>
        <div class="title">Agent 发展历程</div>
        <div class="desc">Codex / Claude Code / OpenClaw / Hermes 功能分享</div>
      </div>
      <div class="arrow" aria-hidden="true">→</div>
    </a>
  </main>
</body>
</html>
